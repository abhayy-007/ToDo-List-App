<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - ToDo List App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="container auth-container">
      <div class="header auth-header">
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to your ToDoList account</p>
      </div>

      <!-- Success & Error Messages -->
      <div th:if="${param.registered}" class="alert alert-success">
        <span>Account created successfully! Please log in.</span>
      </div>

      <div th:if="${param.error}" class="alert alert-error">
        <span>Invalid username or password</span>
      </div>

      <div th:if="${param.logout}" class="alert alert-success">
        <span>You have been logged out successfully</span>
      </div>

      <form th:action="@{/login}" method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            placeholder="Enter username"
            required
            autofocus
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Enter password"
            required
          />
        </div>

        <div class="form-actions" style="margin-top: 25px;">
          <button type="submit" class="btn btn-block">Login</button>
        </div>
      </form>

      <div class="auth-footer-link">
        <span>Don't have an account?</span>
        <a th:href="@{/register}">Create an account</a>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <p>AI assistance was used to help build this frontend interface.</p>
      </footer>
    </div>
  </body>
</html>
