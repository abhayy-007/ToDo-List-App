<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo List App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="container">
      <!-- Header Section -->
      <div class="header">
        <h2>ToDo List App</h2>
        <div class="header-actions">
          <a th:href="@{/todos}" class="btn">Add New Task</a>
          <a th:href="@{/logout}" class="btn btn-danger">Logout</a>
        </div>
      </div>

      <!-- Success & Error Messages -->
      <div th:if="${success_msg}" class="alert alert-success">
        <span th:text="${success_msg}"></span>
      </div>

      <div th:if="${error_msg}" class="alert alert-error">
        <span th:text="${error_msg}"></span>
      </div>

      <!-- Main Todo List Table -->
      <div th:if="${not #lists.isEmpty(todo_list)}">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Description</th>
              <th>Status</th>
              <th>Priority</th>
              <th>Due Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="todo : ${todo_list}">
              <td th:text="${todo.title}" style="font-weight: 600">Title</td>
              <td th:text="${todo.description}">Description</td>
              <td>
                <span
                  th:class="'badge badge-status-' + ${todo.status != null ? #strings.toLowerCase(#strings.replace(todo.status.name(), '_', '-')) : 'pending'}"
                  th:text="${todo.status != null ? #strings.replace(todo.status.name(), '_', ' ') : 'PENDING'}"
                  >Status</span
                >
              </td>
              <td>
                <span
                  th:class="'badge badge-priority-' + ${todo.priority != null ? #strings.toLowerCase(todo.priority.name()) : 'medium'}"
                  th:text="${todo.priority != null ? todo.priority.name() : 'MEDIUM'}"
                  >Priority</span
                >
              </td>
              <td>
                <span
                  th:text="${todo.dueDate}"
                  th:classappend="${todo.dueDate != null and todo.dueDate.isBefore(T(java.time.LocalDate).now())} ? 'overdue'"
                  >2026-08-05</span
                >
                <span
                  th:if="${todo.dueDate != null and todo.dueDate.isBefore(T(java.time.LocalDate).now())}"
                  class="overdue"
                >
                  (Overdue)</span
                >
              </td>
              <td class="actions-cell">
                <a
                  th:href="@{/todos/update/{id}(id=${todo.id})}"
                  class="action-link"
                  >Edit</a
                >
                <form
                  th:action="@{/todos/delete/{id}(id=${todo.id})}"
                  method="post"
                  style="display: inline-block; margin: 0;"
                >
                  <button
                    type="submit"
                    class="action-link delete"
                    onclick="
                      return confirm(
                        'Are you sure you want to delete this task?',
                      );
                    "
                  >
                    Delete
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Empty State -->
      <div
        th:if="${#lists.isEmpty(todo_list)}"
        style="text-align: center; padding: 40px; color: #7f8c8d"
      >
        <p>No tasks found. Click "Add New Task" to get started!</p>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <p>AI assistance was used to help build this frontend interface.</p>
      </footer>
    </div>
  </body>
</html>
