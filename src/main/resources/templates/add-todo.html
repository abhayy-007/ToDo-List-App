<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Task</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="container" style="max-width: 600px;">
      <div class="header">
        <h2>Create New Task</h2>
      </div>

      <form th:action="@{/todos/add}" th:object="${todo_schema}" method="post">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" class="form-control" th:field="*{title}" placeholder="Enter task title" required />
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" class="form-control" th:field="*{description}" rows="4" placeholder="Enter task description"></textarea>
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" class="form-control" th:field="*{status}">
            <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
          </select>
        </div>

        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority" class="form-control" th:field="*{priority}">
            <option th:each="priority : ${priorities}" th:value="${priority}" th:text="${priority}"></option>
          </select>
        </div>

        <div class="form-group">
          <label for="dueDate">Due Date</label>
          <input type="date" id="dueDate" class="form-control" th:field="*{dueDate}" />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn">Save Task</button>
          <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>

      <a th:href="@{/}" class="back-link">← Back to List</a>

      <!-- Footer -->
      <footer class="footer">
        <p>AI assistance was used to help build this frontend interface.</p>
      </footer>
    </div>
  </body>
</html>
